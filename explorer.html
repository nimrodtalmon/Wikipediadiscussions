<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דפי שיחה — בריאות הנפש בוויקיפדיה העברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --panel:#FAFBFA; --ink:#16232B; --mute:#6B7A83; --line:#D3D9D6;
  --blue:#2B6F8A; --blue-soft:#CFE0E8; --ochre:#9C7A1E; --ochre-soft:#EFE4C2;
  --serif:"Frank Ruhl Libre",serif; --sans:"Heebo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px}
a{color:var(--blue)}
header{display:flex;align-items:baseline;gap:1.2rem;padding:.9rem 1.4rem .6rem;border-bottom:1px solid var(--line)}
header h1{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0}
header .meta{color:var(--mute);font-size:.85rem}
main{display:grid;grid-template-columns:19rem 27rem 1fr;height:calc(100% - 3.4rem)}
section{overflow:auto;border-inline-start:1px solid var(--line);padding:.6rem 0}
section:first-child{border:0}
h2{font-family:var(--serif);font-weight:500;font-size:1rem;margin:.3rem 1.2rem .6rem;color:var(--mute)}
.controls{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:0 1.2rem .6rem;font-size:.85rem;color:var(--mute)}
.controls input[type=search]{font:inherit;font-size:.85rem;padding:.25rem .5rem;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);width:11rem}
.controls input[type=range]{width:7rem;accent-color:var(--blue);vertical-align:middle}
.controls label{cursor:pointer}
/* articles */
.art{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.55rem 1.2rem;cursor:pointer;border-inline-start:3px solid transparent}
.art:hover{background:var(--panel)}
.art.sel{background:var(--panel);border-inline-start-color:var(--blue)}
.art .t{font-family:var(--serif);font-size:1.05rem;font-weight:500}
.art .t.adj::after{content:"נלווה";font-family:var(--sans);font-size:.7rem;font-weight:400;color:var(--ochre);background:var(--ochre-soft);padding:0 .35rem;border-radius:2px;margin-inline-start:.5rem;vertical-align:middle}
.art .n{font-size:.85rem;color:var(--mute);text-align:left;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;display:flex;gap:1px;background:transparent}
.bar i{display:block;height:100%;background:var(--blue-soft)}
.bar i.rich{background:var(--blue)}
/* threads */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-weight:500;color:var(--mute);text-align:right;padding:.35rem .6rem;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--bg)}
th.asc::after{content:" ↑"} th.desc::after{content:" ↓"}
td{padding:.4rem .6rem;border-bottom:1px solid #E4E8E6;vertical-align:top;font-variant-numeric:tabular-nums}
td.num{text-align:left;width:3.2rem;color:var(--mute)}
td.num b{color:var(--ink);font-weight:500}
tr.th{cursor:pointer} tr.th:hover td{background:var(--panel)} tr.th.sel td{background:var(--panel);box-shadow:inset 3px 0 var(--blue)}
td .ttl{font-family:var(--serif);font-size:1rem}
td .pg{display:block;font-size:.72rem;color:var(--mute)}
/* reader */
.reader{padding:0 1.6rem 3rem}
.reader h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:.4rem 0 .2rem;line-height:1.25}
.reader .sub{color:var(--mute);font-size:.85rem;margin-bottom:1.2rem}
.reader .sub a{margin-inline-start:.8rem}
.cmt{display:grid;grid-template-columns:1fr 11rem;gap:0 1rem;padding:.55rem 0;border-top:1px solid #E4E8E6;line-height:1.6;max-width:62rem}
.cmt .body{word-break:break-word}
.cmt .who{font-size:.78rem;color:var(--mute);text-align:left;line-height:1.35;padding-top:.15rem}
.cmt .who b{display:block;font-weight:500;color:var(--ink)}
.cmt .who .d{font-variant-numeric:tabular-nums}
.cmt.unsigned .who{color:#B4BDC2}
.body .tmpl{color:var(--mute);font-size:.8em;border:1px dashed var(--line);padding:0 .3rem;border-radius:2px}
.body .sig{display:none}
.empty{color:var(--mute);padding:2rem 1.6rem;font-family:var(--serif);font-size:1.1rem;max-width:30rem;line-height:1.5}
.tabs{display:flex;gap:1.2rem;margin:0 0 .8rem;border-bottom:1px solid var(--line)}
.tabs a{color:var(--mute);text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent;font-size:.9rem}
.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin:.6rem 0 1rem;font-size:.8rem;color:var(--mute)}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;margin-inline-start:.3rem;vertical-align:-1px}
svg text{font-family:var(--sans)}
.node{cursor:pointer}
.snip{background:var(--panel);border-inline-start:3px solid var(--blue);padding:.6rem .9rem;margin-top:.8rem;max-width:46rem;line-height:1.55}
.snip .w{font-size:.78rem;color:var(--mute);margin-bottom:.2rem}
.edot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-inline-end:.35rem;vertical-align:0}
.colorby{font-size:.82rem;color:var(--mute);margin-inline-start:auto}
.colorby a{color:var(--mute);text-decoration:none;padding:0 .35rem}
.colorby a.on{color:var(--ink);border-bottom:2px solid var(--blue)}
.tabs{align-items:baseline}
.back{display:none;font-size:.85rem;padding:.3rem 1.2rem}
@media (max-width:700px){
  #ths th:nth-child(4),#ths td:nth-child(4),#ths th:nth-child(5),#ths td:nth-child(5){display:none}
}
@media (max-width:900px){
  main{grid-template-columns:1fr;height:auto}
  section{border:0;display:none;min-height:60vh}
  main[data-view=articles] #arts,main[data-view=threads] #ths,main[data-view=reader] #rd{display:block}
  .back{display:block}
  .cmt{grid-template-columns:1fr}
  .cmt .who{text-align:right;order:-1}
  .cmt .who b{display:inline;margin-inline-end:.5rem}
}
@media (prefers-reduced-motion:no-preference){.art,tr.th td{transition:background .12s}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1><a href="./" style="color:inherit;text-decoration:none">דפי שיחה על בריאות הנפש</a></h1>
  <span class="meta" id="meta">טוען…</span>
</header>
<main data-view="articles">
  <section id="arts">
    <h2>ערכים</h2>
    <div class="controls">
      <label><input type="checkbox" id="fCore" checked> ליבה</label>
      <label><input type="checkbox" id="fAdj" checked> נלווים</label>
    </div>
    <div id="artList"></div>
  </section>
  <section id="ths">
    <a href="#" class="back" data-to="articles">→ כל הערכים</a>
    <h2 id="thsTitle">דיוני שיחה</h2>
    <div class="controls">
      <input type="search" id="q" placeholder="חיפוש בכותרות">
      <label>לפחות <span id="minV">1</span> תגובות <input type="range" id="min" min="0" max="20" value="1"></label>
    </div>
    <div id="strip" style="padding:0 1.2rem .5rem"></div>
    <table><thead><tr>
      <th data-k="title">דיון</th><th data-k="comments" class="desc">תגובות</th><th data-k="editors">עורכים</th><th data-k="chars">תווים</th><th data-k="first">התחלה</th><th data-k="post">יציבות אחרי</th>
    </tr></thead><tbody id="thBody"></tbody></table>
  </section>
  <section id="rd">
    <a href="#" class="back" data-to="threads">→ לרשימת הדיונים</a>
    <div id="reader" class="reader"><div class="empty">בחירת ערך משמאל, ואז דיון, מציגה את השיחה כאן כרצף תגובות עם שם העורך והתאריך בשוליים.</div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SIG=/(\d{1,2}:\d{2}),?\s+(\d{1,2}\s+ב?[א-ת]+\s+\d{4})\s+\((?:IST|IDT|UTC)\)/g;
const USER=/\[\[(?:משתמש|משתמשת|שיחת משתמש|שיחת משתמשת|User|User talk):([^|\]#/]+)[^\]]*\]\]/;
let D, cur=null, curTh=null, sortK="comments", sortDir=-1, colorMode="emo";
const EMO={agg:{c:"#B3402A",he:"תוקפנות"},con:{c:"#3E7C4F",he:"פיוס"},fru:{c:"#C08A1F",he:"תשישות"},neu:{c:"#98A5AB",he:"ניטרלי"}};
const main=$("main");
fetch("site/corpus.json?v=1788323143").then(r=>r.json()).then(d=>{D=d;
  const A=d.articles, T=A.reduce((s,a)=>s+a.threads.length,0), C=A.reduce((s,a)=>s+a.threads.reduce((x,t)=>x+t.comments,0),0);
  $("#meta").textContent=`${A.length} ערכים · ${T} דיונים · ${C} תגובות חתומות · נבנה ${d.built}`;
  renderArts();});
function renderArts(){
  const core=$("#fCore").checked, adj=$("#fAdj").checked;
  const list=D.articles.filter(a=>(a.ring==="core"&&core)||(a.ring==="adjacent"&&adj))
    .map(a=>({...a,c:a.threads.reduce((s,t)=>s+t.comments,0)})).sort((x,y)=>y.c-x.c);
  const mx=Math.max(...list.map(a=>a.c),1);
  $("#artList").innerHTML=list.map(a=>{
    const ths=[...a.threads].sort((x,y)=>y.comments-x.comments);
    const bar=ths.filter(t=>t.comments).map(t=>`<i class="${t.comments>=5?'rich':''}" style="width:${t.comments/mx*100}%"></i>`).join("");
    return `<div class="art ${cur===a.title?'sel':''}" data-t="${esc(a.title)}" tabindex="0">
      <span class="t ${a.ring==='adjacent'?'adj':''}">${esc(a.title)}</span>
      <span class="n">${a.c} תגובות · ${a.threads.length} דיונים · ${(a.stab.revert_rate*100).toFixed(0)}% שחזורים</span>
      <div class="bar" title="כל פס = דיון; כהה = 5+ תגובות">${bar}</div></div>`;}).join("");
  document.querySelectorAll(".art").forEach(el=>{el.onclick=el.onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;selectArt(el.dataset.t);};});
}
function selectArt(t){cur=t;curTh=null;renderArts();renderThs();main.dataset.view="threads";
  $("#reader").innerHTML=`<div class="empty">בחירת דיון מהרשימה תציג אותו כאן.</div>`;}
function renderThs(){
  const a=D.articles.find(x=>x.title===cur); if(!a)return;
  const st=a.stab;
  $("#thsTitle").innerHTML=`${esc(a.title)} — ${a.threads.length} דיונים · ${a.talk_revs} עריכות שיחה · ${a.article_revs} עריכות בערך<br><span style="font-weight:400">יציבות: ${st.identity_reverts} שחזורים (${(st.revert_rate*100).toFixed(1)}%) · ${st.war_episodes} מלחמות עריכה · הגרסה הנוכחית בת ${st.current_version_days} ימים</span>`;
  renderStrip(a);
  const q=$("#q").value.trim(), mn=+$("#min").value;
  let rows=a.threads.map((t,i)=>({...t,i,post:t.link?t.link.post_days:-1})).filter(t=>t.comments>=mn&&(!q||t.title.includes(q)));
  rows.sort((x,y)=>{const u=x[sortK],v=y[sortK];return (typeof u==="number"?u-v:String(u).localeCompare(String(v),"he"))*sortDir;});
  $("#thBody").innerHTML=rows.map(t=>`<tr class="th ${curTh===t.i?'sel':''}" data-i="${t.i}" tabindex="0">
    <td><span class="ttl">${esc(t.title)}</span>${t.page.includes("/")?`<span class="pg">${esc(t.page.split(":")[1])}</span>`:""}</td>
    <td class="num"><b>${t.comments}</b></td><td class="num">${t.editors}</td><td class="num">${(t.chars/1000).toFixed(1)}k</td><td class="num">${t.first||"—"}</td><td class="num">${t.link?`<div style="display:inline-block;vertical-align:middle;height:5px;border-radius:2px;background:#3E7C4F;opacity:${Math.min(0.95,0.25+Math.log10(t.link.post_days+1)/3.5).toFixed(2)};width:${Math.max(3,Math.min(40,Math.log10(t.link.post_days+1)*13)).toFixed(0)}px"></div> ${t.link.post_days}${t.link.censored?"+":""}`:"—"}</td></tr>`).join("")
    ||`<tr><td colspan="6" class="empty">אין דיונים שעונים לסינון.</td></tr>`;
  document.querySelectorAll("tr.th").forEach(el=>{el.onclick=el.onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;showThread(+el.dataset.i);};});
}
function wiki(s){
  s=esc(s);
  s=s.replace(/\{\{([^{}|]+)(?:\|[^{}]*)?\}\}/g,(m,n)=>`<span class="tmpl">${n.trim()}</span>`);
  s=s.replace(USER.source?new RegExp(USER.source,"g"):USER,(m,u)=>`<span class="u">${u.trim()}</span>`);
  s=s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'<a href="https://he.wikipedia.org/wiki/$1" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\[\[([^\]]+)\]\]/g,'<a href="https://he.wikipedia.org/wiki/$1" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\[(https?:\/\/\S+)\s+([^\]]+)\]/g,'<a href="$1" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/'''(.+?)'''/g,"<b>$1</b>").replace(/''(.+?)''/g,"<i>$1</i>");
  s=s.replace(/&lt;(\/?)(s|small|br|u)\s*\/?&gt;/g,"<$1$2>").replace(/&lt;\/?nowiki&gt;/g,"");
  s=s.replace(/&lt;!--[\s\S]*?--&gt;/g,"");
  return s.replace(SIG,'<span class="sig">$&</span>');
}
function showThread(i){
  curTh=i; const a=D.articles.find(x=>x.title===cur), t=a.threads[i]; renderThs();
  const url=`https://he.wikipedia.org/wiki/${encodeURIComponent(t.page)}#${encodeURIComponent(t.title.replace(/ /g,"_"))}`;
  $("#reader").innerHTML=`<h3>${esc(t.title)}</h3><div class="sub">${esc(a.title)} · ${t.comments} תגובות חתומות · ${t.editors} עורכים${t.first?` · ${t.first} עד ${t.last}`:""}${t.q?` · איכות הגרסה (LLM, ניסיוני): דיוק ${t.q.accuracy}/7 · ביסוס ${t.q.sourcing}/7 · איזון ${t.q.neutrality}/7`:""}${t.link?` · בחלון הדיון: ${t.link.win_edits} עריכות, ${t.link.win_reverts} שחזורים · שחזור הבא ${t.link.post_days} ימים אחרי${t.link.censored?" (טרם)":""}`:""}<a href="${url}" target="_blank" rel="noopener">לדף המקור</a></div>
  <div id="outcome"></div>
  <div class="tabs"><a href="#" id="tabTree" class="on">מבנה הדיון</a><a href="#" id="tabRaw">השיחה</a><span class="colorby">צבע לפי <a href="#" id="cbE">רגש</a><a href="#" id="cbU">עורך</a></span></div><div id="view"></div>`;
  $("#cbE").onclick=e=>{e.preventDefault();colorMode="emo";setTab(curTab,t)};
  $("#cbU").onclick=e=>{e.preventDefault();colorMode="ed";setTab(curTab,t)};
  $("#tabTree").onclick=e=>{e.preventDefault();setTab("tree",t)};
  $("#tabRaw").onclick=e=>{e.preventDefault();setTab("raw",t)};
  renderOutcome(a,t);
  main.dataset.view="reader"; $("#rd").scrollTop=0;
  if(!t.cmts){$("#view")&&0;t.cmts=[];}
  setTab(t.cmts.length>1?"tree":"raw",t);
}
let curTab="tree";
function setTab(which,t){ curTab=which;
  $("#cbE").className=colorMode==="emo"?"on":""; $("#cbU").className=colorMode==="ed"?"on":"";
  $("#tabTree").className=which==="tree"?"on":""; $("#tabRaw").className=which==="raw"?"on":"";
  if(which==="raw") renderRaw(t); else renderTree(t);
}
function renderOutcome(a,t){
  if(!t.link||!t.first){$("#outcome").innerHTML="";return;}
  const W=Math.max(300,Math.min(($("#rd").clientWidth||window.innerWidth)-60,640)), H=44, pad=8, y0=20;
  const d=x=>new Date(x).getTime(), DAY=86400000;
  const w0=d(t.first)-DAY, w1=d(t.last)+8*DAY;
  const revAll=(a.tl?a.tl.rev:[]).map(d0=>new Date(d0).getTime());
  const nxt=revAll.filter(x=>x>=w1).sort((p,q)=>p-q)[0];
  const end=nxt||Date.now();
  const X=x=>pad+(x-w0)/(end-w0||1)*(W-2*pad);
  let g=`<rect x="${X(w0)}" y="${y0-8}" width="${X(w1)-X(w0)}" height="16" fill="#CFE0E8" opacity="0.55"/>`;
  g+=`<rect x="${X(w1)}" y="${y0-2}" width="${Math.max(X(end)-X(w1),1)}" height="4" fill="#3E7C4F" opacity="0.8"/>`;
  revAll.filter(x=>x>=w0&&x<w1).forEach(x=>g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${y0-8}" y2="${y0+8}" stroke="#B3402A" stroke-width="1.2" opacity="0.8"/>`);
  t.cmts.filter(c=>c.date).forEach(c=>g+=`<circle cx="${X(d(c.date))}" cy="${y0}" r="2.6" fill="${EMO[c.emo.label].c}"/>`);
  if(nxt)g+=`<line x1="${X(nxt)}" x2="${X(nxt)}" y1="${y0-10}" y2="${y0+10}" stroke="#B3402A" stroke-width="2"/>`;
  g+=`<text x="${X(w0)}" y="${H-3}" font-size="8.5" fill="#9AA5AB">${t.first}</text>`;
  g+=`<text x="${W-pad}" y="${H-3}" font-size="8.5" fill="#9AA5AB" text-anchor="end">${nxt?"שחזור אחרי "+t.link.post_days+" ימ׳":"ללא שחזור עד היום ("+t.link.post_days+" ימ׳)"}</text>`;
  $("#outcome").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="direction:ltr">${g}</svg>`;
}
function renderRaw(t){
  $("#view").innerHTML=t.cmts.map(c=>`<div class="cmt ${c.signed?'':'unsigned'}" style="margin-inline-start:${Math.min(c.ind,8)*1.1}rem"><div class="body">${wiki(c.text)}</div><div class="who"><b><i class="edot" style="background:${EMO[c.emo.label].c}"></i>${esc(c.user||(c.signed?"?":"לא חתום"))}</b><span class="d">${c.date}</span></div></div>`).join("");
}
function editorColors(cmts){
  const eds=[...new Set(cmts.filter(c=>c.user).map(c=>c.user))];
  const col={}; eds.forEach((e,i)=>col[e]=`hsl(${Math.round(i*137.5)%360} 42% 46%)`);
  return {eds,col};
}
function renderStrip(a){
  const tl=a.tl; if(!tl){$("#strip").innerHTML="";return;}
  const W=Math.max(320,($("#ths").clientWidth||window.innerWidth)-40);
  const pad=6, labelW=70, plotW=W-labelW-2*pad;
  const m0=new Date(tl.m0+"-01").getTime(), m1=Date.now();
  const X=d=>W-labelW-pad-(new Date(d).getTime()-m0)/(m1-m0)*plotW;
  const Xi=i=>W-labelW-pad-(i+0.5)/tl.edits.length*plotW; // month index → x
  const nM=tl.edits.length;
  // monthly reverts
  const revM=new Array(nM).fill(0);
  const mIdx=d=>{const t=new Date(d);return Math.min(nM-1,Math.max(0,(t.getFullYear()-new Date(m0).getFullYear())*12+t.getMonth()-new Date(m0).getMonth()));};
  tl.rev.forEach(d=>revM[mIdx(d)]++);
  // cumulative net construction
  let cum=[],c=0; for(let i=0;i<nM;i++){c+=tl.edits[i]-2*revM[i];cum.push(c);}
  const cMax=Math.max(...cum,1), cMin=Math.min(...cum,0);
  const H1=72, y1=(v)=>8+(cMax-v)/(cMax-cMin||1)*(H1-16);
  let line="M "+cum.map((v,i)=>`${Xi(i).toFixed(1)} ${y1(v).toFixed(1)}`).join(" L ");
  // sentiment balance per month (3-month smoothed)
  const val=new Array(nM).fill(0);
  a.threads.forEach(t=>t.cmts.forEach(cm=>{if(!cm.date)return;const w={agg:-1,fru:-0.5,con:1,neu:0}[cm.emo.label];if(w)val[mIdx(cm.date)]+=w;}));
  const sm=val.map((_,i)=>{let s=0,n=0;for(let k=Math.max(0,i-1);k<=Math.min(nM-1,i+1);k++){s+=val[k];n++;}return s/n;});
  const sMax=Math.max(...sm.map(Math.abs),1);
  const H2=44, z=H1+10+H2/2, ys=v=>z-v/sMax*(H2/2-4);
  let sent="";
  sm.forEach((v,i)=>{if(Math.abs(v)<1e-6)return;
    sent+=`<rect x="${(Xi(i)-plotW/nM/2).toFixed(1)}" y="${Math.min(z,ys(v)).toFixed(1)}" width="${(plotW/nM).toFixed(2)}" height="${Math.abs(z-ys(v)).toFixed(1)}" fill="${v>0?"#3E7C4F":"#B3402A"}" opacity="0.75" shape-rendering="crispEdges"/>`;});
  // quality diamonds on top panel
  let qmarks="";
  a.threads.forEach((t,i)=>{if(!t.q)return;const x=X(t.q.rev_ts.slice(0,10)),m=mIdx(t.q.rev_ts.slice(0,10)),y=y1(cum[m])-10;
    qmarks+=`<g class="tmark" data-i="${i}" style="cursor:pointer"><path d="M ${x} ${y-6} l 5 6 l -5 6 l -5 -6 z" fill="#C08A1F" stroke="#fff" stroke-width="1"><title>איכות (LLM): דיוק ${t.q.accuracy}/7 — ${esc(t.title)}</title></path><text x="${x}" y="${y-9}" font-size="8.5" fill="#9C7A1E" text-anchor="middle">${t.q.accuracy}</text></g>`;});
  // discussion lanes
  const yL=H1+10+H2+12;
  const ths=a.threads.map((t,i)=>({t,i})).filter(x=>x.t.first).sort((x,y)=>x.t.first<y.t.first?-1:1);
  const lanes=[]; const laneH=11;
  const items=ths.map(x=>{const e=X(x.t.first),ss=Math.min(X(x.t.last||x.t.first),e-4);
    let L=lanes.findIndex(v=>v>e+2); if(L<0){L=lanes.length;lanes.push(1e9);} lanes[L]=ss;
    const n={agg:0,con:0,fru:0}; x.t.cmts.forEach(c=>{if(c.emo.label!=="neu")n[c.emo.label]++});
    const dom=Object.keys(n).sort((p,q)=>n[q]-n[p])[0];
    return {...x,s:ss,e,L,col:n[dom]>0?EMO[dom].c:"#8FA0A8"};});
  let marks=items.map(x=>`<line class="tmark" data-i="${x.i}" x1="${x.s.toFixed(1)}" x2="${x.e.toFixed(1)}" y1="${yL+x.L*laneH}" y2="${yL+x.L*laneH}" stroke="${x.col}" stroke-width="6" stroke-linecap="round" style="cursor:pointer"><title>${esc(x.t.title)} — ${x.t.comments} תגובות</title></line>`).join("");
  const H=yL+lanes.length*laneH+16;
  let g=`<path d="${line}" fill="none" stroke="#2B6F8A" stroke-width="1.8"/>`+qmarks;
  g+=`<line x1="${X(m1)}" x2="${X(m0)}" y1="${z}" y2="${z}" stroke="#C8D0CD"/>`+sent+marks;
  g+=`<text x="${W-2}" y="${8+10}" font-size="10" fill="#2B6F8A" text-anchor="end">בנייה נטו</text>`;
  g+=`<text x="${W-2}" y="${z+3}" font-size="10" fill="#6B7A83" text-anchor="end">מאזן רגשי</text>`;
  g+=`<text x="${W-2}" y="${yL+6}" font-size="10" fill="#6B7A83" text-anchor="end">דיונים</text>`;
  const yrStep=W<560?4:2;
  for(let y=new Date(m0).getFullYear()+1;y<=new Date(m1).getFullYear();y+=yrStep)
    g+=`<text x="${X(y+"-01-01").toFixed(1)}" y="${H-3}" font-size="9.5" fill="#9AA5AB" text-anchor="middle">${y}</text>`;
  $("#strip").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr" preserveAspectRatio="xMidYMid meet">${g}</svg>
  <div style="font-size:.78rem;color:var(--mute);line-height:1.5">מימין לשמאל: מראשית הערך עד היום. <span style="color:#2B6F8A">קו כחול — בנייה נטו: עולה עם כל עריכה, יורד עם כל שחזור</span>; מישורת או צניחה = מלחמת עריכה. <span style="color:#3E7C4F">ירוק מעל הקו</span>/<span style="color:#B3402A">אדום מתחתיו</span> — מאזן הרגש בדיונים באותו חודש (פיוס מול תוקפנות). <span style="color:#9C7A1E">◆ ציון דיוק (LLM) של גרסה שנבדקה</span>. כל פס תחתון = דיון אחד; לחיצה על פס או על ◆ פותחת את הדיון.</div>`;
  document.querySelectorAll(".tmark").forEach(m=>m.onclick=()=>showThread(+m.dataset.i));
}
function renderTree(t){
  const C=t.cmts; if(!C.length){$("#view").innerHTML=`<div class="empty">אין תגובות מזוהות בדיון הזה.</div>`;return;}
  const {eds,col}=editorColors(C);
  const row=34, step=30, pad=16, R=12;
  const W=Math.max(320,Math.min(($("#rd").clientWidth||window.innerWidth)-40,760)), H=C.length*row+pad*2;
  const x=c=>W-pad-R-Math.min(c.ind,12)*step, y=i=>pad+R+i*row;
  const rad=c=>Math.max(6,Math.min(13,4+2.2*Math.sqrt(c.text.length/120)));
  const fillOf=c=>colorMode==="emo"?EMO[c.emo.label].c:(c.user?col[c.user]:"#FFFFFF");
  let edges="",nodes="",marks="";
  let prevYear="";
  C.forEach((c,i)=>{
    const yr=(c.date||"").slice(0,4);
    if(yr&&prevYear&&yr!==prevYear) marks+=`<line x1="${pad}" x2="${W-pad}" y1="${y(i)-row/2}" y2="${y(i)-row/2}" stroke="#D9DFDC" stroke-dasharray="3 4"/><text x="${pad}" y="${y(i)-row/2-4}" font-size="9" fill="#9AA5AB">${yr}</text>`;
    if(yr) prevYear=yr;
    if(c.parent>=0){const px=x(C[c.parent]),py=y(c.parent),cx=x(c),cy=y(i);
      edges+=`<path d="M ${px} ${py+rad(C[c.parent])} V ${cy} H ${cx+rad(c)}" fill="none" stroke="#C6CFCB" stroke-width="1.3"/>`;}
    const fill=fillOf(c), r=rad(c);
    const stroke=colorMode==="ed"&&!c.user?"#B4BDC2":fill;
    const txtcol=(colorMode==="ed"&&!c.user)?"#8b969c":"#fff";
    nodes+=`<g class="node" data-i="${i}"><circle cx="${x(c)}" cy="${y(i)}" r="${r}" fill="${fill}" stroke="${stroke}"/>
      <text x="${x(c)}" y="${y(i)+3.2}" text-anchor="middle" font-size="8.5" fill="${txtcol}">${esc((c.user||"?").slice(0,2))}</text>
      <text x="${x(c)-r-6}" y="${y(i)+3.5}" text-anchor="end" font-size="9" fill="#9AA5AB">${c.date||""}</text></g>`;
  });
  let legend;
  if(colorMode==="emo"){
    const n={agg:0,con:0,fru:0,neu:0}; C.forEach(c=>n[c.emo.label]++);
    legend=Object.keys(EMO).map(k=>`<span>${EMO[k].he} (${n[k]})<i style="background:${EMO[k].c}"></i></span>`).join("")+`<span style="font-size:.72rem">· סיווג מילוני ראשוני, יוחלף בקידוד מלא</span>`;
  } else {
    legend=eds.slice(0,14).map(e=>`<span>${esc(e)}<i style="background:${col[e]}"></i></span>`).join("")+(eds.length>14?` <span>+${eds.length-14}</span>`:"")+(C.some(c=>!c.user)?'<span>לא מזוהה<i style="background:#fff;border:1px solid #B4BDC2"></i></span>':"");
  }
  $("#view").innerHTML=`<div class="legend">${legend}</div>
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="direction:ltr">${marks}${edges}${nodes}</svg><div id="snip"></div>`;
  document.querySelectorAll(".node").forEach(n=>n.onclick=()=>{const c=C[+n.dataset.i];
    $("#snip").innerHTML=`<div class="snip" style="border-inline-start-color:${EMO[c.emo.label].c}"><div class="w">${esc(c.user||"לא חתום")} · ${c.date} ${c.time||""} · ${EMO[c.emo.label].he}</div>${wiki(c.text)}</div>`;});
}
document.querySelectorAll("th").forEach(h=>h.onclick=()=>{const k=h.dataset.k; if(sortK===k)sortDir*=-1; else{sortK=k;sortDir=k==="title"||k==="first"?1:-1;}
  document.querySelectorAll("th").forEach(x=>x.className=""); h.className=sortDir>0?"asc":"desc"; renderThs();});
$("#q").oninput=renderThs; $("#min").oninput=e=>{$("#minV").textContent=e.target.value;renderThs();};
$("#fCore").onchange=$("#fAdj").onchange=renderArts;
document.querySelectorAll(".back").forEach(b=>b.onclick=e=>{e.preventDefault();main.dataset.view=b.dataset.to;});
</script>
</body>
